room_section_header:
  show_icon: false
  show_state: false
  show_label: false
  tap_action:
    action: none
  hold_action:
    action: none
  variables:
    subtitle: ""
    schedule_entity: ""
    target_entity: ""
  styles:
    grid:
      - grid-template-areas: '"n chev" "meta ."'
      - grid-template-columns: 1fr min-content
      - grid-template-rows: auto auto
      - column-gap: 0.8vw
      - row-gap: 0.2vw
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-radius: 0
      - padding: 0 0 0.5vw 0
      - margin: 0
      - overflow: visible
      - min-height: 52px
    name:
      - justify-self: start
      - align-self: center
      - font-size: clamp(28px, 2.5vw, 40px)
      - line-height: 1.05
      - letter-spacing: -0.04em
      - font-weight: 760
      - color: rgba(255,255,255,0.96)
      - text-shadow: 0 1px 10px rgba(0,0,0,0.16)
    custom_fields:
      meta:
        - justify-self: start
        - align-self: start
        - margin-top: 2px
      chev:
        - justify-self: end
        - align-self: center
        - color: rgba(255,255,255,0.25)
        - width: 1.2vw
        - height: 1.2vw
        - padding-right: 2px
  custom_fields:
    meta: >
      [[[
        if (typeof variables !== 'undefined' && variables && variables.subtitle) {
          return `<span style="font-size: 0.84rem; font-weight: 500; letter-spacing: -0.01em; color: rgba(186,191,198,0.55);">${variables.subtitle}</span>`;
        }
        if (typeof variables === 'undefined' || !variables || !variables.schedule_entity) {
          return `<span style="font-size: 0.84rem; line-height: 1.2; opacity: 0; user-select: none;">&nbsp;</span>`;
        }
        const schedObj = states[variables.schedule_entity];
        if (!schedObj) {
          return `<span style="font-size: 0.84rem; line-height: 1.2; opacity: 0; user-select: none;">&nbsp;</span>`;
        }
        const isOn = schedObj.state === 'on';
        const next = schedObj.attributes.next_event;
        let timeStr = '';
        if (next) {
          const d = new Date(next);
          const h = String(d.getHours()).padStart(2, '0');
          const m = String(d.getMinutes()).padStart(2, '0');
          timeStr = ` • ${isOn ? "jusqu'à" : 'dès'} ${h}:${m}`;
        }
        let targetVal = '';
        if (variables.target_entity && states[variables.target_entity]) {
          const s = states[variables.target_entity].state;
          if (s && s !== 'unknown' && s !== 'unavailable') {
            targetVal = `${parseFloat(s)}°C`;
          }
        }
        const dotColor = isOn ? '#ff9f0a' : 'rgba(255, 255, 255, 0.3)';
        const textColor = isOn ? 'rgba(240, 243, 246, 0.8)' : 'rgba(186, 191, 198, 0.55)';
        const label = targetVal ? `Consigne ${targetVal}` : (isOn ? 'Planning actif' : 'Planning éco');
        return `
          <span style="
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.84rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: ${textColor};
          ">
            <span style="
              width: 5px;
              height: 5px;
              border-radius: 50%;
              background: ${dotColor};
              ${isOn ? 'box-shadow: 0 0 5px rgba(255, 159, 10, 0.7);' : ''}
              display: inline-block;
            "></span>
            ${label}${timeStr}
          </span>
        `;
      ]]]
    chev: >
      [[[ return '<ha-icon icon="mdi:chevron-right"></ha-icon>'; ]]]
