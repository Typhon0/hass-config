- sensor:
    - name: "jellyfin_playing_episode_backdrop_url"
      state: >
        {{ state_attr('sensor.jellyfin_playing', 'entity_picture') | default('', true) }}
- sensor:
    - unique_id: sidebar
      state: template
      attributes:
        time: >
          {% set hours = now().strftime('%H') %}
          {% set minutes = now().strftime('%M') %}
          <span class="time">
            {{ hours }}<span class="time-colon">:</span>{{ minutes }}
          </span>
        date: >
          {% if strptime(states('sensor.date'), '%Y-%m-%d').day != None %}
          {% set days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'] %}
          {% set months = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
          'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'] %}
            {{ days[now().weekday()] }}<br>
            {{ strptime(states('sensor.date'), '%Y-%m-%d').day }} {{ months[now().month-1] }}
          {% endif %}
        tarif: >
          {% set heure = now().hour %}
          {% set minute = now().minute %}
          {% set time = heure * 60 + minute %}
          {# Heures Creuses: 21h22 - 5h22 #}
          {% if time >= 1282 or time < 322 %}
            <span class="chip tarif hc"><span class="dot on"></span>Heures creuses • jusqu'à 05:22</span>
          {% else %}
            <span class="chip tarif hp"><span class="dot off"></span>Heures pleines • creuses à 21:22</span>
          {% endif %}
- trigger:
    - trigger: time_pattern
      minutes: /15
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.maison
      data:
        type: daily
      response_variable: daily
    - action: weather.get_forecasts
      target:
        entity_id: weather.maison
      data:
        type: hourly
      response_variable: hourly
  sensor:
    - name: "Weather Forecast Daily"
      unique_id: weather_forecast_daily
      state: "{{ now().isoformat() }}"
      attributes:
        forecast: "{{ daily['weather.maison']['forecast'] }}"
    - name: "Weather Forecast Hourly"
      unique_id: weather_forecast_hourly
      state: "{{ now().isoformat() }}"
      attributes:
        forecast: "{{ hourly['weather.maison']['forecast'] }}"
