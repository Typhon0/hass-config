button_card_templates: !include_dir_merge_named button_card_templates
kiosk_mode:
  hide_header: false
views:
  - type: custom:grid-layout
    title: Home
    layout:
      margin: 0
      grid-gap: calc(var(--custom-layout-card-padding) * 0.92)
      grid-template-columns: 1fr repeat(4, minmax(0, 1fr))
      grid-template-rows: auto auto auto
      grid-template-areas: |
        "sidebar salon bureau cuisine chambre"
        "sidebar media buanderie energie maison"
        "sidebar footer footer footer footer"
      mediaquery:
        "(max-width: 800px)":
          grid-gap: calc(var(--custom-layout-card-padding) * 1.45)
          grid-template-columns: 0 repeat(2, 1fr) 0
          grid-template-rows: repeat(7, fit-content(100%))
          grid-template-areas: |
            ". sidebar sidebar ."
            ". salon cuisine ."
            ". bureau chambre ."
            ". media buanderie ."
            ". energie maison ."
            ". footer footer ."
        "(max-width: 1200px)":
          grid-gap: calc(var(--custom-layout-card-padding) * 0.9)
          grid-template-columns: 0.95fr repeat(2, minmax(0, 1fr))
          grid-template-rows: auto auto auto auto auto
          grid-template-areas: |
            "sidebar salon cuisine"
            "sidebar bureau chambre"
            "sidebar media buanderie"
            "sidebar energie maison"
            "sidebar footer footer"
    cards:
      - type: custom:button-card
        view_layout:
          grid-area: 1 / 2 / 2 / 5
        name: SET THEME TO "tablet" IN PROFILE
        tap_action:
          action: navigate
          navigation_path: /profile
        styles:
          card:
            - display: >
                [[[ return hass.themes.theme === 'tablet' ? 'none' : 'initial'; ]]]
          name:
            - z-index: 1
            - overflow: visible
            - color: red
            - font-weight: bolder
            - font-size: xxx-large
            - background: yellow

      - type: vertical-stack
        card_mod:
          style: |
            :host {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
        view_layout:
          grid-area: sidebar
        cards:
          - type: custom:button-card
            entity: sensor.template_sidebar
            template: sidebar
          - type: custom:button-card
            entity: weather.maison
            template: sidebar_weather
            tap_action: !include popup/weather.yaml
          - type: conditional
            conditions:
              - entity: input_boolean.laundry_display
                state: "on"
            card:
              type: custom:button-card
              entity: timer.laundry
              double_tap_action:
                action: call-service
                service: input_boolean.turn_off
                service_data:
                  entity_id: input_boolean.laundry_display
              template: laundry

      - type: vertical-stack
        card_mod:
          style: |
            :host {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
        view_layout:
          grid-area: salon
        cards:
          - type: custom:button-card
            name: Salon
            template: room_section_header
            variables:
              schedule_entity: schedule.schedule_chauffage_salon
              target_entity: sensor.consigne_chauffage_salon
            tap_action: !include popup/room_salon.yaml
            double_tap_action:
              action: more-info
              entity: schedule.schedule_chauffage_salon
            hold_action:
              action: more-info
              entity: schedule.schedule_chauffage_salon
          - type: grid
            columns: 2
            square: false
            card_mod:
              style: |
                #root {
                  row-gap: 16px !important;
                  column-gap: 16px !important;
                }
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }
            cards:
              - type: custom:button-card
                entity: light.lampe_salon
                name: Lampe
                template:
                  - light
                  - icon_hue
                double_tap_action:
                  action: more-info
              - type: custom:button-card
                entity: switch.lumiere_buffet_socket_1
                name: Buffet
                double_tap_action:
                  action: more-info
                template:
                  - base
                  - icon_shade
                  - loader
              - type: custom:button-card
                entity: sensor.thermo_2_temperature
                name: Température
                tap_action: !include popup/ambiance_salon.yaml
                double_tap_action:
                  action: more-info
                  entity: schedule.schedule_chauffage_salon
                hold_action:
                  action: more-info
                  entity: schedule.schedule_chauffage_salon
                template:
                  - base
                  - circle
                  - icon_thermometer
                variables:
                  circle_input: >
                    [[[ return entity ? entity.state : ''; ]]]
                  circle_input_unit: "°C"
                state_display: >
                  [[[
                    const sched = states['schedule.schedule_chauffage_salon'];
                    return (sched && sched.state === 'on') ? 'Planning actif' : 'Planning éco';
                  ]]]
              - type: custom:button-card
                entity: media_player.sejour
                name: TV
                state_display: >
                  [[[
                    if (variables.state === 'playing') return 'On';
                    if (variables.state === true) return variables.translate_unknown;
                  ]]]
                hold_action: !include popup/vardagsrum_tv.yaml
                template:
                  - base
                  - icon_tv
                  - loader

      - type: vertical-stack
        card_mod:
          style: |
            :host {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
        view_layout:
          grid-area: bureau
        cards:
          - type: custom:button-card
            name: Bureau
            template: room_section_header
            variables:
              subtitle: "Espace de travail"
            tap_action: !include popup/room_bureau.yaml
          - type: grid
            columns: 2
            square: false
            card_mod:
              style: |
                #root {
                  row-gap: 16px !important;
                  column-gap: 16px !important;
                }
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }
            cards:
              - type: custom:button-card
                entity: light.led_strip_bureau
                name: Led Bureau
                template:
                  - light
                  - icon_hue
                double_tap_action:
                  action: more-info
              - type: custom:button-card
                entity: light.lampe_bureau
                name: Lampe Bureau
                template:
                  - light
                  - icon_spot
                double_tap_action:
                  action: more-info
              - type: custom:button-card
                entity: sensor.pc_loic_loggeduser
                name: PC
                tap_action: !include popup/bureau_dator.yaml
                template:
                  - base
                  - icon_imac
                variables:
                  lock: >
                    [[[
                      let lock = states['lock.dator'];
                      return lock === undefined || lock.state;
                    ]]]
                  trigger: >
                    [[[
                      let trigger = states['script.home_leave'];
                      return trigger === undefined || trigger;
                    ]]]
              - type: custom:button-card
                entity: light.lumiere_bureau
                name: Bureau
                template:
                  - light
                  - icon_hue
                tap_action:
                  action: call-service
                  service: light.toggle
                  service_data:
                    entity_id:
                      - light.led_strip_bureau
                      - light.lampe_bureau
                double_tap_action:
                  action: more-info
                state_display: >
                  [[[
                    const strip = states['light.led_strip_bureau'];
                    const lamp = states['light.lampe_bureau'];
                    const on = (strip && strip.state === 'on') || (lamp && lamp.state === 'on');
                    return on ? 'On' : 'Off';
                  ]]]

      - type: vertical-stack
        card_mod:
          style: |
            :host {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
        view_layout:
          grid-area: cuisine
        cards:
          - type: custom:button-card
            name: Cuisine
            template: room_section_header
            variables:
              subtitle: "Confort & Équipements"
            tap_action: !include popup/room_cuisine.yaml
          - type: grid
            columns: 2
            square: false
            card_mod:
              style: |
                #root {
                  row-gap: 16px !important;
                  column-gap: 16px !important;
                }
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }
            cards:
              - type: custom:button-card
                name: Éclairage
                state_display: En attente
                tap_action: !include popup/room_cuisine.yaml
                double_tap_action:
                  action: more-info
                template:
                  - base
                  - icon_lamp
              - type: custom:button-card
                entity: sensor.cuisine_timers
                name: Minuteur
                tap_action:
                  action: more-info
                  entity: media_player.nesthub7ade
                double_tap_action:
                  action: more-info
                template:
                  - base
                  - icon_nest_mini
                state_display: >
                  [[[
                    if (!entity || entity.state === 'unavailable' || entity.state === 'unknown') return 'Aucun';
                    return entity.state;
                  ]]]
              - type: custom:button-card
                entity: sensor.refrigerateur_fridge_temp
                name: Réfrigérateur
                tap_action:
                  action: more-info
                  entity: sensor.refrigerateur
                double_tap_action:
                  action: more-info
                  entity: sensor.refrigerateur_fridge_temp
                template:
                  - base
                  - circle
                  - icon_fridge
                variables:
                  circle_input: >
                    [[[
                      if (!entity || entity.state === 'unavailable' || entity.state === 'unknown') return '4';
                      return entity.state;
                    ]]]
                  circle_input_unit: "°C"
                state_display: >
                  [[[
                    let door = states['binary_sensor.refrigerateur_door_open'];
                    if (door && door.state === 'on') return 'Porte ouverte !';
                    let eco = states['switch.refrigerateur_eco_friendly'];
                    if (eco && eco.state === 'on') return 'Mode Éco';
                    return 'Fermé • Normal';
                  ]]]
              - type: custom:button-card
                name: Chauffage
                state_display: En attente
                tap_action: !include popup/room_cuisine.yaml
                double_tap_action:
                  action: more-info
                template:
                  - base
                  - icon_radiator

      - type: vertical-stack
        card_mod:
          style: |
            :host {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
        view_layout:
          grid-area: chambre
        cards:
          - type: custom:button-card
            name: Chambre
            template: room_section_header
            variables:
              schedule_entity: schedule.schedule_chauffage_chambre
              target_entity: sensor.consigne_chauffage_chambre
            tap_action: !include popup/room_chambre.yaml
            double_tap_action:
              action: more-info
              entity: schedule.schedule_chauffage_chambre
            hold_action:
              action: more-info
              entity: schedule.schedule_chauffage_chambre
          - type: grid
            columns: 2
            square: false
            card_mod:
              style: |
                #root {
                  row-gap: 16px !important;
                  column-gap: 16px !important;
                }
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }
            cards:
              - type: custom:button-card
                entity: light.mibedsidelamp2
                name: Lampe de chevet
                template:
                  - light
                  - icon_lamp
                double_tap_action:
                  action: more-info
              - type: custom:button-card
                entity: sensor.thermo_1_temperature
                name: Température
                tap_action:
                  action: more-info
                template:
                  - base
                  - circle
                  - icon_thermometer
                variables:
                  circle_input: >
                    [[[ return entity ? entity.state : ''; ]]]
                  circle_input_unit: "°C"
                state_display: >
                  [[[
                    if (!entity || entity.state === 'unavailable' || entity.state === 'unknown') return '17.6 °C';
                    return `${entity.state} °C`;
                  ]]]
              - type: custom:button-card
                entity: climate.thermostat1
                name: Radiateur
                tap_action: !include popup/thermostat_chambre.yaml
                double_tap_action:
                  action: more-info
                  entity: schedule.schedule_chauffage_chambre
                hold_action:
                  action: more-info
                  entity: schedule.schedule_chauffage_chambre
                template:
                  - base
                  - circle
                  - icon_radiator
                variables:
                  circle_input: >
                    [[[
                      if (!entity || entity.state === 'unavailable') return '';
                      return entity.attributes.temperature || '';
                    ]]]
                  circle_input_unit: "°C"
                state_display: >
                  [[[
                    const sched = states['schedule.schedule_chauffage_chambre'];
                    return (sched && sched.state === 'on') ? 'Planning actif' : 'Planning éco';
                  ]]]
              - type: custom:button-card
                entity: climate.forceclima
                name: Clim
                double_tap_action:
                  action: more-info
                template:
                  - base
                  - circle
                  - icon_fan2
                variables:
                  circle_input: >
                    [[[
                      if (!entity || entity.state === 'unavailable' || entity.state === 'unknown') return '';
                      return entity.state === 'cool' ? entity.attributes.temperature : entity.attributes.current_temperature;
                    ]]]
                  circle_input_unit: "°C"
                state_display: >
                  [[[
                    if (!entity || entity.state === 'unavailable' || entity.state === 'unknown') return 'Arrêt';
                    if (entity.state === 'off') return 'Off';
                    if (entity.state === 'cool') return 'Clim';
                    return entity.state;
                  ]]]

      - type: vertical-stack
        card_mod:
          style: |
            :host {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
        view_layout:
          grid-area: media
        cards:
          - type: custom:button-card
            name: Média
            template: room_section_header
            variables:
              subtitle: "Ambiance & Audio"
            tap_action: !include popup/room_media.yaml
          - type: grid
            columns: 1
            square: false
            cards:
              - type: custom:swipe-card
                parameters:
                  speed: 550
                  spaceBetween: 40
                  threshold: 5
                cards:
                  - type: horizontal-stack
                    cards:
                      - type: conditional
                        conditions:
                          - entity: select.conditional_media
                            state_not: Salon
                          - entity: select.conditional_media
                            state_not: Chambre
                          - entity: select.conditional_media
                            state_not: Spotify
                          - entity: select.conditional_media
                            state_not: Cuisine
                          - entity: sensor.jellyfin_playing
                            state: playing
                        card:
                          type: custom:button-card
                          entity: sensor.jellyfin_playing
                          name: En lecture
                          tap_action:
                            action: none
                          template:
                            - conditional_media
                            - icon_jellyfin
                      - type: conditional
                        conditions:
                          - entity: select.conditional_media
                            state_not: Salon
                          - entity: select.conditional_media
                            state_not: Chambre
                          - entity: select.conditional_media
                            state_not: Spotify
                          - entity: select.conditional_media
                            state_not: Cuisine
                          - entity: sensor.jellyfin_playing
                            state: paused
                        card:
                          type: custom:button-card
                          entity: sensor.jellyfin_playing
                          name: En pause
                          tap_action:
                            action: none
                          template:
                            - conditional_media
                            - icon_jellyfin
                      - type: conditional
                        conditions:
                          - entity: select.conditional_media
                            state_not: Salon
                          - entity: select.conditional_media
                            state_not: Chambre
                          - entity: select.conditional_media
                            state_not: Spotify
                          - entity: select.conditional_media
                            state_not: Cuisine
                          - entity: sensor.jellyfin_playing
                            state_not: playing
                          - entity: sensor.jellyfin_playing
                            state_not: paused
                        card:
                          type: grid
                          columns: 2
                          square: false
                          card_mod:
                            style: |
                              #root {
                                row-gap: 16px !important;
                                column-gap: 16px !important;
                              }
                              ha-card {
                                background: transparent !important;
                                border: none !important;
                                box-shadow: none !important;
                              }
                          cards:
                            - type: custom:button-card
                              entity: media_player.sejour
                              name: TV Séjour
                              template:
                                - base
                                - icon_tv
                              tap_action:
                                action: toggle
                              double_tap_action:
                                action: more-info
                            - type: custom:button-card
                              entity: media_player.samsung_qn90aa_75_tv
                              name: TV Salon
                              template:
                                - base
                                - icon_apple_tv
                              tap_action:
                                action: more-info
                            - type: custom:button-card
                              entity: media_player.spotify
                              name: Spotify
                              template:
                                - base
                                - icon_spotify
                              tap_action:
                                action: more-info
                            - type: custom:button-card
                              entity: media_player.cuisine
                              name: Enceinte Cuisine
                              template:
                                - base
                                - icon_nest_mini
                              tap_action:
                                action: more-info
                      - type: conditional
                        conditions:
                          - entity: select.conditional_media
                            state: Salon
                        card:
                          type: custom:button-card
                          entity: media_player.sejour
                          triggers_update:
                            - sensor.sejour_artwork
                          name: >
                            [[[
                              let app = entity?.attributes?.app_name || entity?.attributes?.source || 'Apple TV',
                                  state = entity?.state === 'paused' ? 'En pause' : 'En lecture';
                              return `${app} • ${state}`;
                            ]]]
                          template:
                            - conditional_media
                            - icon_appletv_dynamic
                      - type: conditional
                        conditions:
                          - entity: select.conditional_media
                            state: Chambre
                        card:
                          type: custom:button-card
                          entity: media_player.cuisine
                          template:
                            - conditional_media
                            - icon_apple_tv
                      - type: conditional
                        conditions:
                          - entity: select.conditional_media
                            state: Spotify
                        card:
                          type: custom:button-card
                          entity: media_player.spotify
                          template:
                            - conditional_media
                            - icon_spotify
                      - type: conditional
                        conditions:
                          - entity: select.conditional_media
                            state: Cuisine
                        card:
                          type: custom:button-card
                          entity: media_player.nesthub7ade
                          template:
                            - conditional_media
                            - icon_nest_mini
                  - type: grid
                    columns: 2
                    cards:
                      - type: custom:button-card
                        entity: media_player.samsung_qn90aa_75_tv
                        name: Salon
                        template:
                          - media
                          - icon_apple_tv
                      - type: custom:button-card
                        entity: media_player.cuisine
                        name: Chambre
                        template:
                          - media
                          - icon_apple_tv
                      - type: custom:button-card
                        entity: media_player.spotify
                        name: Spotify
                        template:
                          - media
                          - icon_spotify
                      - type: custom:button-card
                        entity: media_player.nesthub7ade
                        name: Nest Mini
                        template:
                          - media
                          - icon_nest_mini

      - type: vertical-stack
        card_mod:
          style: |
            :host {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
        view_layout:
          grid-area: buanderie
        cards:
          - type: custom:button-card
            name: Buanderie
            template: room_section_header
            variables:
              subtitle: "Chaufferie & Entretien"
            tap_action: !include popup/room_buanderie.yaml
          - type: grid
            columns: 2
            square: false
            card_mod:
              style: |
                #root {
                  row-gap: 16px !important;
                  column-gap: 16px !important;
                }
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }
            cards:
              - type: custom:button-card
                entity: light.spot_buanderie
                name: Spot Buanderie
                template:
                  - light
                  - icon_spot
              - type: custom:button-card
                entity: sensor.seche_linge
                name: Sèche-linge
                template:
                  - dryer
                tap_action: !include popup/dryer.yaml
              - type: custom:button-card
                entity: climate.vitrocrossal_300_cu3a_heating
                name: Chaudière
                tap_action:
                  action: more-info
                template:
                  - base
                  - circle
                  - icon_boiler_flame
                variables:
                  circle_input: >
                    [[[ return entity ? entity.attributes.current_temperature : ''; ]]]
                  circle_input_unit: "°C"
                state_display: >
                  [[[
                    if (!entity || entity.state === 'unavailable') return 'En attente';
                    if (entity.state === 'off') return 'Standby';
                    return entity.state;
                  ]]]
              - type: custom:button-card
                entity: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
                name: Ballon ECS
                tap_action:
                  action: more-info
                template:
                  - base
                  - circle
                  - icon_water_boiler
                variables:
                  circle_input: >
                    [[[ return entity ? entity.attributes.current_temperature : ''; ]]]
                  circle_input_unit: "°C"
                state_display: >
                  [[[
                    if (!entity || entity.state === 'unavailable') return 'En attente';
                    return entity.state === 'on' ? 'Prêt • 50°C' : 'Standby';
                  ]]]

      - type: vertical-stack
        card_mod:
          style: |
            :host {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
        view_layout:
          grid-area: energie
        cards:
          - type: custom:button-card
            name: Énergie
            template: room_section_header
            variables:
              subtitle: "Mobilité & Recharge"
            tap_action: !include popup/tesla.yaml
          - type: grid
            columns: 2
            square: false
            card_mod:
              style: |
                #root {
                  row-gap: 16px !important;
                  column-gap: 16px !important;
                }
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }
            cards:
              - type: custom:button-card
                entity: sensor.tesla_model_3_highland_battery_level
                name: Tesla
                tap_action: !include popup/tesla.yaml
                template:
                  - tesla
                  - circle
                  - icon_tesla
                  - loader
                triggers_update:
                  - sensor.tesla_model_3_highland_charging
                  - sensor.tesla_model_3_highland_battery_range
                variables:
                  circle_input: >
                    [[[
                      if (!entity || entity.state === 'unavailable') return '';
                      return parseInt(entity.state);
                    ]]]
                  circle_input_unit: "%"
                state_display: >
                  [[[
                    const charging = states['sensor.tesla_model_3_highland_charging'];
                    if (charging && (charging.state === 'Charging' || charging.state === 'charging')) {
                      return 'En charge';
                    }
                    const range = states['sensor.tesla_model_3_highland_battery_range'];
                    if (range && range.state) {
                      return `${Math.round(parseFloat(range.state))} km`;
                    }
                    return variables.translate_unknown;
                  ]]]
              - type: custom:button-card
                entity: sensor.wallbox_pulsar_max_sn_1331158_status_description
                name: Chargeur
                template:
                  - wallbox_charger
                  - circle
                  - icon_wallbox
                  - loader
                tap_action: !include popup/wallbox_charger.yaml
                hold_action:
                  action: call-service
                  service: switch.toggle
                  service_data:
                    entity_id: switch.wallbox_pulsar_max_sn_1331158_pause_resume
                  haptic: light
                variables:
                  circle_input: >
                    [[[
                      const powerState = states['sensor.wallbox_pulsar_max_sn_1331158_charging_power'].state;
                      const power = parseFloat(powerState);
                      if (isNaN(power) || power <= 0) return '';
                      return power.toFixed(2);
                    ]]]
                  circle_input_unit: "kW"
              - type: custom:button-card
                entity: timer.hot_water_boost
                name: Boost ECS
                template:
                  - boost_timer
                tap_action:
                  action: call-service
                  service: script.hot_water_boost_1h
                hold_action:
                  action: call-service
                  service: timer.cancel
                  target:
                    entity_id: timer.hot_water_boost
                show_state: true
                triggers_update: all
                update_timer: 1s
                state_display: >
                  [[[
                    if (!entity) return '';
                    if (entity.state !== 'active') return '1h';
                    const finishesAt = entity.attributes.finishes_at;
                    if (!finishesAt) return entity.attributes.remaining || 'En cours';
                    const diff = Math.max(0, Math.floor((new Date(finishesAt) - new Date()) / 1000));
                    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                    const s = String(diff % 60).padStart(2, '0');
                    return `${h}:${m}:${s}`;
                  ]]]
              - type: custom:button-card
                entity: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
                name: Ballon ECS
                tap_action:
                  action: more-info
                template:
                  - base
                  - circle
                  - icon_water_boiler
                variables:
                  circle_input: >
                    [[[ return entity ? entity.attributes.current_temperature : ''; ]]]
                  circle_input_unit: "°C"
                state_display: >
                  [[[
                    if (!entity || entity.state === 'unavailable') return 'En attente';
                    return `${entity.attributes.current_temperature || 50}°C • ${entity.state === 'on' ? 'Prêt' : 'Éco'}`;
                  ]]]

