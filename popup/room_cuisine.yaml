action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Cuisine
    size: wide
    content:
      type: vertical-stack
      cards:
        - type: markdown
          content: |
            # Cuisine
            Gestion de l'éclairage et du confort thermique (en attente d'équipement)
          card_mod:
            style: |
              ha-card {
                background: transparent;
                box-shadow: none;
                border: none;
                padding: 10px 8px 2px;
                margin: 0 0 6px 0;
              }
              ha-markdown {
                color: rgba(255,255,255,0.96);
              }
              h1 {
                margin: 0 0 4px 0;
                font-size: 2rem;
                line-height: 1.05;
                font-weight: 700;
              }
              p {
                margin: 0;
                color: rgba(255,255,255,0.62);
                font-size: 0.98rem;
              }
        - type: grid
          columns: 2
          square: false
          card_mod:
            style: |
              #root {
                gap: 18px !important;
                padding: 4px 0 2px 0 !important;
              }
              ha-card {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
              }
          cards:
            - type: custom:button-card
              name: Éclairage
              state_display: En attente
              template:
                - base
                - icon_lamp
            - type: custom:button-card
              name: Chauffage
              state_display: En attente
              template:
                - base
                - icon_climate
