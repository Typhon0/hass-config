action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Cuisine
    size: wide
    content:
      type: vertical-stack
      cards:
        - type: markdown
          content: |
            # Cuisine
            Éclairage, confort, minuterie et électroménager
          card_mod:
            style: |
              ha-card {
                background: transparent;
                box-shadow: none;
                border: none;
                padding: 10px 8px 2px;
                margin: 0 0 6px 0;
              }
              ha-markdown {
                color: rgba(255,255,255,0.96);
              }
              h1 {
                margin: 0 0 4px 0;
                font-family: "sf display", SF Pro Display, system-ui, sans-serif;
                font-size: 2rem;
                line-height: 1.05;
                font-weight: 700;
              }
              p {
                margin: 0;
                color: rgba(255,255,255,0.62);
                font-size: 0.98rem;
              }
        - type: grid
          columns: 2
          square: false
          card_mod:
            style: |
              #root {
                gap: 18px !important;
                padding: 4px 0 2px 0 !important;
              }
              ha-card {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
              }
          cards:
            - type: custom:button-card
              name: Éclairage
              state_display: En attente
              double_tap_action:
                action: more-info
              template:
                - base
                - icon_lamp

            - type: custom:button-card
              entity: sensor.cuisine_timers
              name: Minuteur
              tap_action:
                action: more-info
                entity: media_player.cuisine
              double_tap_action:
                action: more-info
              template:
                - base
                - icon_nest_mini
              state_display: >
                [[[
                  if (!entity || entity.state === 'unavailable' || entity.state === 'unknown') return 'Aucun';
                  return entity.state;
                ]]]

            - type: custom:button-card
              entity: sensor.refrigerateur_fridge_temp
              name: Réfrigérateur
              tap_action:
                action: more-info
                entity: sensor.refrigerateur
              double_tap_action:
                action: more-info
                entity: sensor.refrigerateur_fridge_temp
              template:
                - base
                - circle
                - icon_fridge
              variables:
                circle_input: >
                  [[[
                    if (!entity || entity.state === 'unavailable' || entity.state === 'unknown') return '4';
                    return entity.state;
                  ]]]
                circle_input_unit: "°C"
              state_display: >
                [[[
                  let door = states['binary_sensor.refrigerateur_door_open'];
                  if (door && door.state === 'on') return 'Porte ouverte !';
                  let eco = states['switch.refrigerateur_eco_friendly'];
                  if (eco && eco.state === 'on') return 'Mode Éco';
                  return 'Fermé • Normal';
                ]]]

            - type: custom:button-card
              name: Chauffage
              state_display: En attente
              double_tap_action:
                action: more-info
              template:
                - base
                - icon_climate
