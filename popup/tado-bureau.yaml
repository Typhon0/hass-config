action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Bureau
    content:
      type: vertical-stack
      cards:
        - type: entities
          card_mod:
            style: |
              #states { padding-top: 0.5em; padding-bottom: 0em; }
          entities:
            - entity: light.lumiere_bureau
              name: Éclairage Bureau
            - entity: light.lampe_bureau
              name: Lampe Bureau
            - entity: light.led_strip_bureau
              name: Bandeau LED Bureau
