action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Chambre
    size: wide
    content:
      type: vertical-stack
      cards:
        - type: markdown
          content: |
            # Chambre
            Éclairage, température, chauffage et climatisation
          card_mod:
            style: |
              ha-card {
                background: transparent;
                box-shadow: none;
                border: none;
                padding: 10px 8px 2px;
                margin: 0 0 6px 0;
              }
              ha-markdown {
                color: rgba(255,255,255,0.96);
              }
              h1 {
                margin: 0 0 4px 0;
                font-size: 2rem;
                line-height: 1.05;
                font-weight: 700;
              }
              p {
                margin: 0;
                color: rgba(255,255,255,0.62);
                font-size: 0.98rem;
              }
        - type: grid
          columns: 4
          square: false
          card_mod:
            style: |
              #root {
                gap: 18px !important;
                padding: 4px 0 2px 0 !important;
              }
              ha-card {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
              }
          cards:
            - type: custom:button-card
              entity: light.mibedsidelamp2
              name: Lampe de chevet
              template:
                - light
                - icon_lamp
              tap_action:
                action: toggle
              double_tap_action:
                action: more-info
            - type: custom:button-card
              entity: sensor.thermo_1_temperature
              name: Température
              template:
                - base
                - circle
                - icon_climate
              tap_action:
                action: more-info
              variables:
                circle_input: >
                  [[[ return entity ? entity.state : ''; ]]]
                circle_input_unit: "°C"
            - type: custom:button-card
              entity: climate.thermostat1
              name: Radiateur
              template:
                - base
                - circle
                - icon_climate
              tap_action:
                action: more-info
              variables:
                circle_input: >
                  [[[ 
                    if (!entity || entity.state === 'unavailable') return '';
                    return entity.attributes.temperature || '';
                  ]]]
                circle_input_unit: "°C"
            - type: custom:button-card
              entity: climate.forceclima
              name: Clim
              template:
                - base
                - circle
                - icon_fan2
              tap_action:
                action: more-info
              variables:
                circle_input: >
                  [[[ 
                    if (!entity || entity.state === 'unavailable') return '';
                    return entity.state === 'cool' ? entity.attributes.temperature : entity.attributes.current_temperature;
                  ]]]
                circle_input_unit: "°C"
        - type: entities
          title: Détails chambre
          show_header_toggle: false
          entities:
            - entity: light.mibedsidelamp2
              name: Lampe de chevet
            - entity: sensor.thermo_1_temperature
              name: Température ambiante
            - entity: sensor.thermo_1_humidity
              name: Humidité
            - entity: climate.thermostat1
              name: Vanne radiateur
            - entity: climate.forceclima
              name: Climatiseur
            - entity: timer.aeration_chambre
              name: Pause Aération
            - type: section
              label: Chauffage & Planning
            - entity: schedule.schedule_chauffage_chambre
              name: Planning Chauffage Chambre
              secondary_info: next-event
            - entity: input_number.heating_chambre_sleep
              name: Consigne Sommeil
            - entity: input_number.heating_chambre_eco
              name: Consigne Éco
          card_mod:
            style: |
              ha-card {
                margin-top: 22px;
                border-radius: 26px;
                background: rgba(255,255,255,0.04);
                border: 1px solid rgba(255,255,255,0.06);
                box-shadow: none;
                overflow: hidden;
              }
              .card-header {
                font-size: 1rem;
                font-weight: 600;
                color: rgba(255,255,255,0.9);
              }
