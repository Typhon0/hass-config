action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Télévision & Apple TV Séjour
    content:
      type: vertical-stack
      cards:
        - type: entities
          card_mod:
            style: |
              #states { padding-top: 0.5em; padding-bottom: 0em; }
          entities:
            - entity: media_player.sejour
              name: Apple TV Séjour
              secondary_info: last-changed
            - entity: media_player.samsung_qn90aa_75_tv
              name: Samsung QN90A 75"

        - type: horizontal-stack
          cards:
            - type: custom:button-card
              entity: media_player.sejour
              icon: mdi:power
              name: On/Off
              tap_action:
                action: call-service
                service: media_player.toggle
                service_data:
                  entity_id: media_player.sejour
              template: icon_name

            - type: custom:button-card
              entity: media_player.sejour
              icon: mdi:play-pause
              name: Lecture
              tap_action:
                action: call-service
                service: media_player.media_play_pause
                service_data:
                  entity_id: media_player.sejour
              template: icon_name

            - type: custom:button-card
              entity: media_player.samsung_qn90aa_75_tv
              icon: mdi:volume-mute
              name: Muet
              tap_action:
                action: call-service
                service: media_player.volume_mute
                service_data:
                  entity_id: media_player.samsung_qn90aa_75_tv
                  is_volume_muted: true
              template: icon_name

            - type: custom:button-card
              entity: media_player.samsung_qn90aa_75_tv
              icon: mdi:volume-minus
              name: Vol -
              tap_action:
                action: call-service
                service: media_player.volume_down
                service_data:
                  entity_id: media_player.samsung_qn90aa_75_tv
              template: icon_name

            - type: custom:button-card
              entity: media_player.samsung_qn90aa_75_tv
              icon: mdi:volume-plus
              name: Vol +
              tap_action:
                action: call-service
                service: media_player.volume_up
                service_data:
                  entity_id: media_player.samsung_qn90aa_75_tv
              template: icon_name
