homeassistant:
  customize:
    schedule.schedule_chauffage_salon:
      friendly_name: "Planning Chauffage Salon"
      icon: "mdi:calendar-clock"
    schedule.schedule_chauffage_chambre:
      friendly_name: "Planning Chauffage Chambre"
      icon: "mdi:calendar-clock"

input_number:
  heating_chambre_sleep:
    name: Chauffage Chambre Sommeil
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 17

  heating_chambre_eco:
    name: Chauffage Chambre Eco
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 16

  heating_salon_day:
    name: Chauffage Salon Jour
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 19

  heating_salon_evening:
    name: Chauffage Salon Soir
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 19

  heating_salon_night:
    name: Chauffage Salon Nuit
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 17

  heating_salon_away:
    name: Chauffage Salon Absence
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 16

  hot_water_boost_restore_temp:
    name: Hot Water Boost Restore Temp
    min: 10
    max: 60
    step: 1
    unit_of_measurement: "°C"
    mode: box
    initial: 50

input_datetime:
  vicare_last_mode_change:
    name: "Dernier changement de mode ViCare"
    has_date: true
    has_time: true

timer:
  hot_water_boost:
    name: Hot Water Boost
    duration: "01:00:00"

  aeration_chambre:
    name: "Pause Aeration Chambre"
    duration: "00:15:00"

  aeration_salon:
    name: "Pause Aeration Salon"
    duration: "00:15:00"

binary_sensor:
  - platform: trend
    sensors:
      chute_temperature_chambre:
        entity_id: sensor.thermo_1_temperature
        sample_duration: 360
        min_gradient: -0.0050
        device_class: opening
      chute_temperature_salon:
        entity_id: sensor.thermo_2_temperature
        sample_duration: 360
        min_gradient: -0.0017
        device_class: opening

script:
  hot_water_boost_1h:
    alias: Hot Water Boost 1h
    mode: restart
    sequence:
      - if:
          - condition: state
            entity_id: timer.hot_water_boost
            state: idle
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.hot_water_boost_restore_temp
            data:
              value: >-
                {{
                  states('number.vitrocrossal_300_cu3a_dhw_temperature') | float(50)
                }}

      - action: water_heater.set_temperature
        target:
          entity_id: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
        data:
          temperature: 50

      - action: number.set_value
        target:
          entity_id: number.vitrocrossal_300_cu3a_dhw_temperature
        data:
          value: 50

      - action: timer.start
        target:
          entity_id: timer.hot_water_boost
        data:
          duration: "01:00:00"

      - action: notify.mobile_app_iphone_de_loic
        data:
          title: "Boost ECS"
          message: >-
            Boost eau chaude lance pour 1h.
            Temperature forcee a 50°C.
            Retour prevu a
            {{ states('input_number.hot_water_boost_restore_temp') | int }}°C.

automation:
  - alias: Gestion Chauffage Intelligente ViCare
    id: gestion_chauffage_intelligente_vicare
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - zone.home
          - schedule.schedule_chauffage_chambre
          - schedule.schedule_chauffage_salon
          - sensor.thermo_1_temperature
          - sensor.thermo_2_temperature
          - timer.aeration_chambre
          - timer.aeration_salon
      - platform: time_pattern
        minutes: "/10"
      - platform: homeassistant
        event: start

    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.vitrocrossal_300_cu3a_heating
            state: unavailable
          - condition: state
            entity_id: climate.vitrocrossal_300_cu3a_heating
            state: unknown

    action:
      - variables:
          someone_home: "{{ states('zone.home') | int(0) > 0 }}"
          outside_temp: "{{ states('sensor.vitrocrossal_300_cu3a_outside_temperature') | float(0) }}"
          bedroom_temp_ok: "{{ states('sensor.thermo_1_temperature') not in ['unknown', 'unavailable', 'none', ''] }}"
          salon_temp_ok: "{{ states('sensor.thermo_2_temperature') not in ['unknown', 'unavailable', 'none', ''] }}"
          bedroom_temp: "{{ states('sensor.thermo_1_temperature') | float(0) }}"
          salon_temp: "{{ states('sensor.thermo_2_temperature') | float(0) }}"
          bedroom_schedule_on: "{{ is_state('schedule.schedule_chauffage_chambre', 'on') }}"
          salon_schedule_on: "{{ is_state('schedule.schedule_chauffage_salon', 'on') }}"
          vicare_mode_current: "{{ state_attr('climate.vitrocrossal_300_cu3a_heating', 'active_vicare_mode') }}"
          thermostat1_target_current: "{{ state_attr('climate.thermostat1', 'temperature') | float(0) }}"
          thermostat1_hvac_current: "{{ states('climate.thermostat1') }}"
          deadband: 0.5
          is_heating_now: "{{ vicare_mode_current == 'forcedNormal' }}"

          # --- Frost / Away targets ---
          frost_floor: 8
          bedroom_away_target: "{{ states('input_number.heating_chambre_eco') | float(16) }}"
          salon_away_target: "{{ states('input_number.heating_salon_away') | float(16) }}"

          bedroom_target: >-
            {% if someone_home and bedroom_schedule_on %}
              {{ states('input_number.heating_chambre_sleep') | float(17) }}
            {% else %}
              {{ states('input_number.heating_chambre_eco') | float(16) }}
            {% endif %}

          salon_target: >-
            {% set h = now().hour + (now().minute / 60) %}
            {% if not someone_home %}
              {{ states('input_number.heating_salon_away') | float(16) }}
            {% elif salon_schedule_on %}
              {% if h >= 22 or h < 7 %}
                {{ states('input_number.heating_salon_night') | float(17) }}
              {% elif h >= 18 %}
                {{ states('input_number.heating_salon_evening') | float(19) }}
              {% else %}
                {{ states('input_number.heating_salon_day') | float(19) }}
              {% endif %}
            {% else %}
              {{ states('input_number.heating_salon_night') | float(17) }}
            {% endif %}

          bedroom_cutoff: >-
            {{ (bedroom_target | float) if is_heating_now else ((bedroom_target | float) - deadband) }}

          salon_cutoff: >-
            {{ (salon_target | float) if is_heating_now else ((salon_target | float) - deadband) }}

          # When away, use away targets with same hysteresis logic
          bedroom_away_cutoff: >-
            {{ (bedroom_away_target | float) if is_heating_now else ((bedroom_away_target | float) - deadband) }}

          salon_away_cutoff: >-
            {{ (salon_away_target | float) if is_heating_now else ((salon_away_target | float) - deadband) }}

          aeration_chambre_active: >-
            {{
              is_state('timer.aeration_chambre', 'active')
              and (now().hour >= 8 and now().hour < 21)
              and not is_state('schedule.schedule_chauffage_chambre', 'on')
            }}
          aeration_salon_active: "{{ is_state('timer.aeration_salon', 'active') }}"

          # --- Frost floor always active (8°C) ---
          # Away mode uses away targets (16°C) with hysteresis
          # Home mode uses normal targets with hysteresis
          bedroom_needs_heat: >-
            {{
              bedroom_temp_ok
              and (not aeration_chambre_active)
              and (
                (someone_home and bedroom_temp < (bedroom_cutoff | float))
                or (not someone_home and bedroom_temp < (bedroom_away_cutoff | float))
                or bedroom_temp < frost_floor
              )
            }}

          salon_needs_heat: >-
            {{
              salon_temp_ok
              and (not aeration_salon_active)
              and (
                (someone_home and salon_temp < (salon_cutoff | float))
                or (not someone_home and salon_temp < (salon_away_cutoff | float))
                or salon_temp < frost_floor
              )
            }}

          any_room_needs_heat: "{{ bedroom_needs_heat or salon_needs_heat }}"
          desired_vicare_mode: "{{ 'forcedNormal' if any_room_needs_heat else 'dhw' }}"
          last_vicare_change: "{{ states('input_datetime.vicare_last_mode_change') }}"
          seconds_since_change: >-
            {{
              (as_timestamp(now()) - as_timestamp(last_vicare_change))
              if last_vicare_change not in ['unknown', 'unavailable', 'none', '']
              else 9999
            }}
          can_change_vicare_mode: >-
            {% if not someone_home %}
              true
            {% elif is_heating_now and desired_vicare_mode == 'dhw' %}
              {# Pour couper le chauffage, attendre au moins 15 min (900s) de chauffe continue #}
              {{ seconds_since_change | float(9999) >= 900 }}
            {% else %}
              {# Pour demarrer le chauffage apres un arret, attendre au moins 10 min (600s) anti-rebond #}
              {{ seconds_since_change | float(9999) >= 600 }}
            {% endif %}

          # Consigne TRV : debridee (+2°C) en demande pour garder le clapet 100% ouvert et eviter la surchauffe chaudier
          thermostat1_target_desired: >-
            {% if bedroom_needs_heat %}
              {{ (bedroom_target | float) + 2.0 }}
            {% else %}
              {{ bedroom_target | float }}
            {% endif %}

      # 1. On pousse la bonne consigne sur le TRV de la chambre
      - if:
          - condition: template
            value_template: "{{ thermostat1_hvac_current != 'heat' }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.thermostat1
            data:
              hvac_mode: heat

      - if:
          - condition: template
            value_template: "{{ (thermostat1_target_current - (thermostat1_target_desired | float)) | abs > 0.2 }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: climate.thermostat1
            data:
              temperature: "{{ thermostat1_target_desired | float }}"

      - if:
          - condition: state
            entity_id: switch.thermostat1_window_detection
            state: "on"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.thermostat1_window_detection

      # 2. Gestion chaudiere
      # forcedNormal = chauffage actif
      # dhw = ECS seule, donc parfait quand aucune piece ne demande du chauffage
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (vicare_mode_current != desired_vicare_mode) and can_change_vicare_mode }}"
            sequence:
              - action: vicare.set_vicare_mode
                target:
                  entity_id: climate.vitrocrossal_300_cu3a_heating
                data:
                  vicare_mode: "{{ desired_vicare_mode }}"

              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.vicare_last_mode_change
                data:
                  timestamp: "{{ now().timestamp() }}"

              - action: notify.mobile_app_iphone_de_loic
                data:
                  title: >-
                    {% if not someone_home %}
                      Passage en absence
                    {% elif desired_vicare_mode == 'forcedNormal' and bedroom_needs_heat and salon_needs_heat %}
                      Chambre et salon en demande
                    {% elif desired_vicare_mode == 'forcedNormal' and bedroom_needs_heat %}
                      Chambre en demande
                    {% elif desired_vicare_mode == 'forcedNormal' and salon_needs_heat %}
                      Salon en demande
                    {% elif desired_vicare_mode == 'forcedNormal' %}
                      Chauffage lance
                    {% else %}
                      Temperature atteinte
                    {% endif %}
                  message: >-
                    {% if not someone_home %}
                      Plus personne n'est a la maison.
                      Passage en mode absence :
                      chauffage coupe, eau chaude conservee.

                    {% elif desired_vicare_mode == 'forcedNormal' and bedroom_needs_heat and salon_needs_heat %}
                      La chambre et le salon sont sous leur consigne de demarrage.
                      Le chauffage demarre.

                    {% elif desired_vicare_mode == 'forcedNormal' and bedroom_needs_heat %}
                      La chambre est sous sa consigne de demarrage.
                      Le chauffage demarre.

                    {% elif desired_vicare_mode == 'forcedNormal' and salon_needs_heat %}
                      Le salon est sous sa consigne de demarrage.
                      Le chauffage demarre.

                    {% elif desired_vicare_mode == 'forcedNormal' %}
                      Une piece a demande du chauffage.
                      Le chauffage demarre.

                    {% else %}
                      Consignes atteintes (ou maison temperee).
                      Bascule en eau chaude sanitaire seule (DHW).
                    {% endif %}

                    Chambre : {{ bedroom_temp | round(1) }}°C / cible {{ bedroom_target | float | round(1) }}°C.
                    Salon : {{ salon_temp | round(1) }}°C / cible {{ salon_target | float | round(1) }}°C.
                    Exterieur : {{ outside_temp | round(1) }}°C.

  - alias: Hot Water Boost End
    id: hot_water_boost_end
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hot_water_boost

      - platform: event
        event_type: timer.cancelled
        event_data:
          entity_id: timer.hot_water_boost

    action:
      - variables:
          restore_temp: "{{ states('input_number.hot_water_boost_restore_temp') | float(50) }}"

      - action: water_heater.set_temperature
        target:
          entity_id: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
        data:
          temperature: "{{ restore_temp }}"

      - action: number.set_value
        target:
          entity_id: number.vitrocrossal_300_cu3a_dhw_temperature
        data:
          value: "{{ restore_temp }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.event_type == 'timer.finished' }}"
            sequence:
              - action: notify.mobile_app_iphone_de_loic
                data:
                  title: "Boost ECS termine"
                  message: "Retour de la cible ECS a {{ restore_temp }}°C."

          - conditions:
              - condition: template
                value_template: "{{ trigger.event.event_type == 'timer.cancelled' }}"
            sequence:
              - action: notify.mobile_app_iphone_de_loic
                data:
                  title: "Boost ECS annule"
                  message: "Boost stoppe manuellement. Retour de la cible ECS a {{ restore_temp }}°C."

  - alias: "Cycle Anti-Legionelle Hebdomadaire ECS"
    id: cycle_anti_legionelle_hebdomadaire_ecs
    mode: single
    trigger:
      # Demarrage le dimanche a 19h00 (debut de la plage de chauffe ViCare 19h-22h)
      - platform: time
        at: "19:00:00"
        id: start_legionella
      # Fin du cycle a 20h30 (apres 1h30 a 60°C)
      - platform: time
        at: "20:30:00"
        id: end_legionella
    condition:
      # Uniquement le dimanche
      - condition: time
        weekday:
          - sun
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: start_legionella
            sequence:
              - action: water_heater.set_temperature
                target:
                  entity_id: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
                data:
                  temperature: 60
              - action: number.set_value
                target:
                  entity_id: number.vitrocrossal_300_cu3a_dhw_temperature
                data:
                  value: 60
              - action: notify.mobile_app_iphone_de_loic
                data:
                  title: "Cycle Anti-Legionelle Hebdomadaire"
                  message: "Montee thermique du ballon d'eau chaude lancee (cible 60°C) jusqu'a 20h30."

          - conditions:
              - condition: trigger
                id: end_legionella
            sequence:
              - action: water_heater.set_temperature
                target:
                  entity_id: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
                data:
                  temperature: 50
              - action: number.set_value
                target:
                  entity_id: number.vitrocrossal_300_cu3a_dhw_temperature
                data:
                  value: 50
              - action: notify.mobile_app_iphone_de_loic
                data:
                  title: "Cycle Anti-Legionelle Termine"
                  message: "Desinfection thermique effectuee. Consigne ECS retablie a 50°C."

  - alias: "Detection Aeration Chambre"
    id: detection_aeration_chambre
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.chute_temperature_chambre
        to: "on"
    condition:
      - condition: time
        after: "08:00:00"
        before: "21:00:00"
      - condition: state
        entity_id: schedule.schedule_chauffage_chambre
        state: "off"
    action:
      - action: timer.start
        target:
          entity_id: timer.aeration_chambre
        data:
          duration: "00:15:00"
      - action: notify.mobile_app_iphone_de_loic
        data:
          title: "Aeration detectee (Chambre)"
          message: "Chute de temperature detectee dans la chambre. Chauffage suspendu pour 15 minutes."

  - alias: "Detection Aeration Salon"
    id: detection_aeration_salon
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.chute_temperature_salon
        to: "on"
    action:
      - action: timer.start
        target:
          entity_id: timer.aeration_salon
        data:
          duration: "00:15:00"
      - action: notify.mobile_app_iphone_de_loic
        data:
          title: "Aeration detectee (Salon)"
          message: "Chute de temperature detectee dans le salon. Chauffage suspendu pour 15 minutes."

template:
  - sensor:
      - name: Chauffage Statut
        unique_id: chauffage_statut
        icon: >-
          {% set home_count = states('zone.home') | int(0) %}
          {% set mode = state_attr('climate.vitrocrossal_300_cu3a_heating', 'active_vicare_mode') %}

          {% if home_count == 0 %}
            mdi:home-export-outline
          {% elif mode == 'forcedNormal' %}
            mdi:fire
          {% elif mode == 'dhw' %}
            mdi:water-boiler
          {% elif mode == 'dhwAndHeating' %}
            mdi:radiator
          {% elif mode == 'forcedReduced' %}
            mdi:leaf
          {% elif mode == 'standby' %}
            mdi:power-sleep
          {% else %}
            mdi:radiator
          {% endif %}
        state: >-
          {% set home_count = states('zone.home') | int(0) %}
          {% set mode = state_attr('climate.vitrocrossal_300_cu3a_heating', 'active_vicare_mode') %}

          {% if home_count == 0 %}
            Absence
          {% elif mode == 'forcedNormal' %}
            Chauffage actif
          {% elif mode == 'dhw' %}
            Eau chaude seule
          {% elif mode == 'dhwAndHeating' %}
            Normal (Chauffage + ECS)
          {% elif mode == 'forcedReduced' %}
            Reduit
          {% elif mode == 'standby' %}
            Veille
          {% elif mode %}
            {{ mode }}
          {% else %}
            Inconnu
          {% endif %}
        attributes:
          personnes_maison: "{{ states('zone.home') | int(0) }}"
          mode_vicare: "{{ state_attr('climate.vitrocrossal_300_cu3a_heating', 'active_vicare_mode') }}"
          chambre_temp: "{{ states('sensor.thermo_1_temperature') }}"
          salon_temp: "{{ states('sensor.thermo_2_temperature') }}"
          temperature_exterieure: "{{ states('sensor.vitrocrossal_300_cu3a_outside_temperature') }}"
          dernier_changement_mode: "{{ states('input_datetime.vicare_last_mode_change') }}"
          aeration_chambre: "{{ is_state('timer.aeration_chambre', 'active') }}"
          aeration_salon: "{{ is_state('timer.aeration_salon', 'active') }}"

      - name: "Consigne Chauffage Salon"
        unique_id: consigne_chauffage_salon
        unit_of_measurement: "°C"
        state: >-
          {% set someone_home = states('zone.home') | int(0) > 0 %}
          {% set salon_schedule_on = is_state('schedule.schedule_chauffage_salon', 'on') %}
          {% set h = now().hour + (now().minute / 60) %}
          {% if not someone_home %}
            {{ states('input_number.heating_salon_away') | float(16) }}
          {% elif salon_schedule_on %}
            {% if h >= 22 or h < 7 %}
              {{ states('input_number.heating_salon_night') | float(17) }}
            {% elif h >= 18 %}
              {{ states('input_number.heating_salon_evening') | float(19) }}
            {% else %}
              {{ states('input_number.heating_salon_day') | float(19) }}
            {% endif %}
          {% else %}
            {{ states('input_number.heating_salon_night') | float(17) }}
          {% endif %}

      - name: "Consigne Chauffage Chambre"
        unique_id: consigne_chauffage_chambre
        unit_of_measurement: "°C"
        state: >-
          {% set someone_home = states('zone.home') | int(0) > 0 %}
          {% set bedroom_schedule_on = is_state('schedule.schedule_chauffage_chambre', 'on') %}
          {% if someone_home and bedroom_schedule_on %}
            {{ states('input_number.heating_chambre_sleep') | float(17) }}
          {% else %}
            {{ states('input_number.heating_chambre_eco') | float(16) }}
          {% endif %}
