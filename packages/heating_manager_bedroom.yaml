homeassistant:
  customize:
    schedule.schedule_chauffage_salon:
      friendly_name: "Planning Chauffage Salon"
      icon: "mdi:calendar-clock"
    schedule.schedule_chauffage_chambre:
      friendly_name: "Planning Chauffage Chambre"
      icon: "mdi:calendar-clock"
    schedule.schedule_eau_chaude:
      friendly_name: "Planning Eau Chaude Sanitaire"
      icon: "mdi:water-boiler"

schedule:
  schedule_eau_chaude:
    name: "Planning Eau Chaude Sanitaire"
    icon: "mdi:water-boiler"
    monday:
      - from: "19:00:00"
        to: "23:00:00"
    tuesday:
      - from: "19:00:00"
        to: "23:00:00"
    wednesday:
      - from: "19:00:00"
        to: "23:00:00"
    thursday:
      - from: "19:00:00"
        to: "23:00:00"
    friday:
      - from: "19:00:00"
        to: "23:00:00"
    saturday:
      - from: "19:00:00"
        to: "23:00:00"
    sunday:
      - from: "19:00:00"
        to: "23:00:00"

input_number:
  heating_chambre_sleep:
    name: Chauffage Chambre Sommeil
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 17

  heating_chambre_eco:
    name: Chauffage Chambre Eco
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 16

  heating_salon_day:
    name: Chauffage Salon Jour
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 19

  heating_salon_evening:
    name: Chauffage Salon Soir
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 19

  heating_salon_night:
    name: Chauffage Salon Nuit
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 17

  heating_salon_away:
    name: Chauffage Salon Absence
    min: 10
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    initial: 16

  hot_water_boost_restore_temp:
    name: Hot Water Boost Restore Temp
    min: 10
    max: 60
    step: 1
    unit_of_measurement: "°C"
    mode: box
    initial: 50

input_datetime:
  vicare_last_mode_change:
    name: "Dernier changement de mode ViCare"
    has_date: true
    has_time: true

timer:
  hot_water_boost:
    name: Hot Water Boost
    duration: "01:00:00"

  aeration_chambre:
    name: "Pause Aération Chambre"
    duration: "00:15:00"

  aeration_salon:
    name: "Pause Aération Salon"
    duration: "00:15:00"

binary_sensor:
  - platform: trend
    sensors:
      chute_temperature_chambre:
        entity_id: sensor.thermo_1_temperature
        sample_duration: 360
        min_gradient: -0.0050
        device_class: opening
      chute_temperature_salon:
        entity_id: sensor.thermo_2_temperature
        sample_duration: 360
        min_gradient: -0.0017
        device_class: opening

script:
  hot_water_boost_1h:
    alias: Hot Water Boost 1h
    mode: restart
    sequence:
      - if:
          - condition: state
            entity_id: timer.hot_water_boost
            state: idle
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.hot_water_boost_restore_temp
            data:
              value: >-
                {{
                  states('number.vitrocrossal_300_cu3a_dhw_temperature') | float(50)
                }}

      - action: water_heater.set_temperature
        target:
          entity_id: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
        data:
          temperature: 55

      - action: timer.start
        target:
          entity_id: timer.hot_water_boost
        data:
          duration: "01:00:00"

      - action: notify.mobile_app_iphone_de_loic
        data:
          title: "☕ Boost ECS"
          message: >-
            Boost eau chaude lancé pour 1h.
            Température forcée à 55°C.
            Retour prévu à
            {{ states('input_number.hot_water_boost_restore_temp') | int }}°C.

automation:
  - alias: Gestion Chauffage Intelligente ViCare
    id: gestion_chauffage_intelligente_vicare
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - zone.home
          - schedule.schedule_chauffage_chambre
          - schedule.schedule_chauffage_salon
          - schedule.schedule_eau_chaude
          - timer.hot_water_boost
          - sensor.thermo_1_temperature
          - sensor.thermo_2_temperature
          - timer.aeration_chambre
          - timer.aeration_salon
          - binary_sensor.vitrocrossal_300_cu3a_dhw_charging
      - platform: time_pattern
        minutes: "/10"
      - platform: homeassistant
        event: start

    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.vitrocrossal_300_cu3a_heating
            state: unavailable

    action:
      - variables:
          someone_home: "{{ states('zone.home') | int(0) > 0 }}"
          outside_temp: "{{ states('sensor.vitrocrossal_300_cu3a_outside_temperature') | float(0) }}"
          bedroom_temp_ok: "{{ states('sensor.thermo_1_temperature') not in ['unknown', 'unavailable', 'none', ''] }}"
          salon_temp_ok: "{{ states('sensor.thermo_2_temperature') not in ['unknown', 'unavailable', 'none', ''] }}"
          bedroom_temp: "{{ states('sensor.thermo_1_temperature') | float(0) }}"
          salon_temp: "{{ states('sensor.thermo_2_temperature') | float(0) }}"
          bedroom_schedule_on: "{{ is_state('schedule.schedule_chauffage_chambre', 'on') }}"
          salon_schedule_on: "{{ is_state('schedule.schedule_chauffage_salon', 'on') }}"
          ecs_schedule_on: "{{ is_state('schedule.schedule_eau_chaude', 'on') }}"
          ecs_boost_on: "{{ is_state('timer.hot_water_boost', 'active') }}"
          dhw_is_charging: "{{ is_state('binary_sensor.vitrocrossal_300_cu3a_dhw_charging', 'on') }}"
          ecs_active: "{{ (ecs_schedule_on or ecs_boost_on) and someone_home }}"
          vicare_mode_current: "{{ state_attr('climate.vitrocrossal_300_cu3a_heating', 'active_vicare_mode') | default('standby', true) }}"
          thermostat1_target_current: "{{ state_attr('climate.thermostat1', 'temperature') | float(0) }}"
          thermostat1_hvac_current: "{{ states('climate.thermostat1') }}"
          deadband: 0.5
          is_heating_now: "{{ vicare_mode_current == 'forcedNormal' }}"

          bedroom_target: >-
            {% if someone_home and bedroom_schedule_on %}
              {{ states('input_number.heating_chambre_sleep') | float(17) }}
            {% else %}
              {{ states('input_number.heating_chambre_eco') | float(16) }}
            {% endif %}

          salon_target: >-
            {% set h = now().hour + (now().minute / 60) %}
            {% if not someone_home %}
              {{ states('input_number.heating_salon_away') | float(16) }}
            {% elif salon_schedule_on %}
              {% if h >= 22 or h < 7 %}
                {{ states('input_number.heating_salon_night') | float(17) }}
              {% elif h >= 18 %}
                {{ states('input_number.heating_salon_evening') | float(19) }}
              {% else %}
                {{ states('input_number.heating_salon_day') | float(19) }}
              {% endif %}
            {% else %}
              {{ states('input_number.heating_salon_night') | float(17) }}
            {% endif %}

          bedroom_cutoff: >-
            {{ (bedroom_target | float) if is_heating_now else ((bedroom_target | float) - deadband) }}

          salon_cutoff: >-
            {{ (salon_target | float) if is_heating_now else ((salon_target | float) - deadband) }}

          aeration_chambre_active: >-
            {{
              is_state('timer.aeration_chambre', 'active')
              and (now().hour >= 8 and now().hour < 21)
              and not is_state('schedule.schedule_chauffage_chambre', 'on')
            }}
          aeration_salon_active: "{{ is_state('timer.aeration_salon', 'active') }}"

          bedroom_needs_heat: >-
            {{
              someone_home
              and bedroom_temp_ok
              and (not aeration_chambre_active)
              and (bedroom_temp < (bedroom_cutoff | float))
            }}

          salon_needs_heat: >-
            {{
              someone_home
              and salon_temp_ok
              and (not aeration_salon_active)
              and (salon_temp < (salon_cutoff | float))
            }}

          any_room_needs_heat: "{{ bedroom_needs_heat or salon_needs_heat }}"
          desired_vicare_mode: >-
            {% if any_room_needs_heat %}
              forcedNormal
            {% elif ecs_active or dhw_is_charging %}
              dhw
            {% else %}
              standby
            {% endif %}
          last_vicare_change: "{{ states('input_datetime.vicare_last_mode_change') }}"
          seconds_since_change: >-
            {{
              (as_timestamp(now()) - as_timestamp(last_vicare_change))
              if last_vicare_change not in ['unknown', 'unavailable', 'none', '']
              else 9999
            }}
          can_change_vicare_mode: >-
            {% if not someone_home %}
              true
            {% elif is_heating_now and desired_vicare_mode in ['dhw', 'standby'] %}
              {# Pour couper le chauffage, attendre au moins 15 min (900s) de chauffe continue #}
              {{ seconds_since_change | float(9999) >= 900 }}
            {% elif desired_vicare_mode == 'forcedNormal' %}
              {# Pour démarrer le chauffage après un arrêt, attendre au moins 10 min (600s) anti-rebond #}
              {{ seconds_since_change | float(9999) >= 600 }}
            {% elif vicare_mode_current == 'dhw' and desired_vicare_mode == 'standby' and dhw_is_charging %}
              {# Ne pas basculer en veille si une charge ECS est en cours de finition #}
              false
            {% else %}
              true
            {% endif %}

          # Consigne TRV : débridée (+2°C) en demande pour garder le clapet 100% ouvert et éviter la surchauffe chaudière
          thermostat1_target_desired: >-
            {% if bedroom_needs_heat %}
              {{ (bedroom_target | float) + 2.0 }}
            {% else %}
              {{ bedroom_target | float }}
            {% endif %}

      # 1. On pousse la bonne consigne sur le TRV de la chambre
      - if:
          - condition: template
            value_template: "{{ thermostat1_hvac_current != 'heat' }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.thermostat1
            data:
              hvac_mode: heat

      - if:
          - condition: template
            value_template: "{{ (thermostat1_target_current - (thermostat1_target_desired | float)) | abs > 0.2 }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: climate.thermostat1
            data:
              temperature: "{{ thermostat1_target_desired | float }}"

      - if:
          - condition: state
            entity_id: switch.thermostat1_window_detection
            state: "on"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.thermostat1_window_detection

      # 2. Gestion chaudière
      # forcedNormal = chauffage actif
      # dhw = ECS autorisée (plage 19h-23h ou boost ou charge en cours)
      # standby = veille complète (nuit ou journée hors plage ECS, maintien antigel actif)
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (vicare_mode_current != desired_vicare_mode) and can_change_vicare_mode }}"
            sequence:
              - action: vicare.set_vicare_mode
                target:
                  entity_id: climate.vitrocrossal_300_cu3a_heating
                data:
                  vicare_mode: "{{ desired_vicare_mode }}"

              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.vicare_last_mode_change
                data:
                  timestamp: "{{ now().timestamp() }}"

              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{
                            desired_vicare_mode == 'forcedNormal'
                            or (vicare_mode_current == 'forcedNormal' and desired_vicare_mode in ['dhw', 'standby'])
                            or (not someone_home)
                          }}
                    sequence:
                      - action: notify.mobile_app_iphone_de_loic
                        data:
                          title: >-
                            {% if not someone_home %}
                              🏠 Passage en absence
                            {% elif desired_vicare_mode == 'forcedNormal' and bedroom_needs_heat and salon_needs_heat %}
                              🔥 Chambre et salon en demande
                            {% elif desired_vicare_mode == 'forcedNormal' and bedroom_needs_heat %}
                              🔥 Chambre en demande
                            {% elif desired_vicare_mode == 'forcedNormal' and salon_needs_heat %}
                              🔥 Salon en demande
                            {% elif desired_vicare_mode == 'forcedNormal' %}
                              🔥 Chauffage lancé
                            {% else %}
                              🌡️ Température atteinte
                            {% endif %}
                          message: >-
                            {% if not someone_home %}
                              Plus personne n'est à la maison.
                              Passage en veille chaudière.
                            {% elif desired_vicare_mode == 'forcedNormal' and bedroom_needs_heat and salon_needs_heat %}
                              La chambre et le salon sont sous leur consigne de démarrage.
                              Le chauffage démarre.
                            {% elif desired_vicare_mode == 'forcedNormal' and bedroom_needs_heat %}
                              La chambre est sous sa consigne de démarrage.
                              Le chauffage démarre.
                            {% elif desired_vicare_mode == 'forcedNormal' and salon_needs_heat %}
                              Le salon est sous sa consigne de démarrage.
                              Le chauffage démarre.
                            {% elif desired_vicare_mode == 'forcedNormal' %}
                              Une pièce a demandé du chauffage.
                              Le chauffage démarre.
                            {% else %}
                              Consignes atteintes. Le chauffage s'éteint.
                              Mode chaudière : {{ desired_vicare_mode }}.
                            {% endif %}

                            Chambre : {{ bedroom_temp | round(1) }}°C / cible {{ bedroom_target | float | round(1) }}°C.
                            Salon : {{ salon_temp | round(1) }}°C / cible {{ salon_target | float | round(1) }}°C.
                            Extérieur : {{ outside_temp | round(1) }}°C.

  - alias: Hot Water Boost End
    id: hot_water_boost_end
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hot_water_boost

      - platform: event
        event_type: timer.cancelled
        event_data:
          entity_id: timer.hot_water_boost

    action:
      - variables:
          restore_temp: "{{ states('input_number.hot_water_boost_restore_temp') | float(50) }}"

      - action: water_heater.set_temperature
        target:
          entity_id: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
        data:
          temperature: "{{ restore_temp }}"

      - action: number.set_value
        target:
          entity_id: number.vitrocrossal_300_cu3a_dhw_temperature
        data:
          value: "{{ restore_temp }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.event_type == 'timer.finished' }}"
            sequence:
              - action: notify.mobile_app_iphone_de_loic
                data:
                  title: "☕ Boost ECS terminé"
                  message: "Retour de la cible ECS à {{ restore_temp }}°C."

          - conditions:
              - condition: template
                value_template: "{{ trigger.event.event_type == 'timer.cancelled' }}"
            sequence:
              - action: notify.mobile_app_iphone_de_loic
                data:
                  title: "☕ Boost ECS annulé"
                  message: "Boost stoppé manuellement. Retour de la cible ECS à {{ restore_temp }}°C."

  - alias: "Cycle Anti-Légionelle Hebdomadaire ECS"
    id: cycle_anti_legionelle_hebdomadaire_ecs
    mode: single
    trigger:
      # Démarrage le dimanche à 19h00 (début de la plage de chauffe ViCare 19h-22h)
      - platform: time
        at: "19:00:00"
        id: start_legionella
      # Fin du cycle à 20h30 (après 1h30 à 60°C)
      - platform: time
        at: "20:30:00"
        id: end_legionella
    condition:
      # Uniquement le dimanche
      - condition: time
        weekday:
          - sun
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: start_legionella
            sequence:
              - action: water_heater.set_temperature
                target:
                  entity_id: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
                data:
                  temperature: 60
              - action: number.set_value
                target:
                  entity_id: number.vitrocrossal_300_cu3a_dhw_temperature
                data:
                  value: 60
              - action: notify.mobile_app_iphone_de_loic
                data:
                  title: "🛡️ Cycle Anti-Légionelle Hebdomadaire"
                  message: "Montée thermique du ballon d'eau chaude lancée (cible 60°C) jusqu'à 20h30."

          - conditions:
              - condition: trigger
                id: end_legionella
            sequence:
              - action: water_heater.set_temperature
                target:
                  entity_id: water_heater.vitrocrossal_300_cu3a_domestic_hot_water
                data:
                  temperature: 50
              - action: number.set_value
                target:
                  entity_id: number.vitrocrossal_300_cu3a_dhw_temperature
                data:
                  value: 50
              - action: notify.mobile_app_iphone_de_loic
                data:
                  title: "✅ Cycle Anti-Légionelle Terminé"
                  message: "Désinfection thermique effectuée. Consigne ECS rétablie à 50°C."

  - alias: "Détection Aération Chambre"
    id: detection_aeration_chambre
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.chute_temperature_chambre
        to: "on"
    condition:
      - condition: time
        after: "08:00:00"
        before: "21:00:00"
      - condition: state
        entity_id: schedule.schedule_chauffage_chambre
        state: "off"
    action:
      - action: timer.start
        target:
          entity_id: timer.aeration_chambre
        data:
          duration: "00:15:00"
      - action: notify.mobile_app_iphone_de_loic
        data:
          title: "❄️ Aération détectée (Chambre)"
          message: "Chute de température détectée dans la chambre. Chauffage suspendu pour 15 minutes."

  - alias: "Détection Aération Salon"
    id: detection_aeration_salon
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.chute_temperature_salon
        to: "on"
    action:
      - action: timer.start
        target:
          entity_id: timer.aeration_salon
        data:
          duration: "00:15:00"
      - action: notify.mobile_app_iphone_de_loic
        data:
          title: "❄️ Aération détectée (Salon)"
          message: "Chute de température détectée dans le salon. Chauffage suspendu pour 15 minutes."

template:
  - sensor:
      - name: Chauffage Statut
        unique_id: chauffage_statut
        icon: >-
          {% set home_count = states('zone.home') | int(0) %}
          {% set mode = state_attr('climate.vitrocrossal_300_cu3a_heating', 'active_vicare_mode') | default('standby', true) %}

          {% if home_count == 0 %}
            mdi:home-export-outline
          {% elif mode == 'forcedNormal' %}
            mdi:fire
          {% elif mode == 'dhw' %}
            mdi:water-boiler
          {% elif mode == 'dhwAndHeating' %}
            mdi:radiator
          {% elif mode == 'forcedReduced' %}
            mdi:leaf
          {% elif mode == 'standby' %}
            mdi:power-sleep
          {% else %}
            mdi:radiator
          {% endif %}
        state: >-
          {% set home_count = states('zone.home') | int(0) %}
          {% set mode = state_attr('climate.vitrocrossal_300_cu3a_heating', 'active_vicare_mode') | default('standby', true) %}

          {% if home_count == 0 %}
            Absence
          {% elif mode == 'forcedNormal' %}
            Chauffage actif
          {% elif mode == 'dhw' %}
            Eau chaude seule
          {% elif mode == 'dhwAndHeating' %}
            Normal (Chauffage + ECS)
          {% elif mode == 'forcedReduced' %}
            Réduit
          {% elif mode == 'standby' %}
            Veille
          {% elif mode %}
            {{ mode }}
          {% else %}
            Inconnu
          {% endif %}
        attributes:
          personnes_maison: "{{ states('zone.home') | int(0) }}"
          mode_vicare: "{{ state_attr('climate.vitrocrossal_300_cu3a_heating', 'active_vicare_mode') | default('standby', true) }}"
          chambre_temp: "{{ states('sensor.thermo_1_temperature') }}"
          salon_temp: "{{ states('sensor.thermo_2_temperature') }}"
          temperature_exterieure: "{{ states('sensor.vitrocrossal_300_cu3a_outside_temperature') }}"
          dernier_changement_mode: "{{ states('input_datetime.vicare_last_mode_change') }}"
          aeration_chambre: "{{ is_state('timer.aeration_chambre', 'active') }}"
          aeration_salon: "{{ is_state('timer.aeration_salon', 'active') }}"

      - name: "Consigne Chauffage Salon"
        unique_id: consigne_chauffage_salon
        unit_of_measurement: "°C"
        state: >-
          {% set someone_home = states('zone.home') | int(0) > 0 %}
          {% set salon_schedule_on = is_state('schedule.schedule_chauffage_salon', 'on') %}
          {% set h = now().hour + (now().minute / 60) %}
          {% if not someone_home %}
            {{ states('input_number.heating_salon_away') | float(16) }}
          {% elif salon_schedule_on %}
            {% if h >= 22 or h < 7 %}
              {{ states('input_number.heating_salon_night') | float(17) }}
            {% elif h >= 18 %}
              {{ states('input_number.heating_salon_evening') | float(19) }}
            {% else %}
              {{ states('input_number.heating_salon_day') | float(19) }}
            {% endif %}
          {% else %}
            {{ states('input_number.heating_salon_night') | float(17) }}
          {% endif %}

      - name: "Consigne Chauffage Chambre"
        unique_id: consigne_chauffage_chambre
        unit_of_measurement: "°C"
        state: >-
          {% set someone_home = states('zone.home') | int(0) > 0 %}
          {% set bedroom_schedule_on = is_state('schedule.schedule_chauffage_chambre', 'on') %}
          {% if someone_home and bedroom_schedule_on %}
            {{ states('input_number.heating_chambre_sleep') | float(17) }}
          {% else %}
            {{ states('input_number.heating_chambre_eco') | float(16) }}
          {% endif %}