###############################################################################
# VITROCROSSAL 300 TELEMETRY & ANTI-SHORT-CYCLE
###############################################################################

sensor:
  - platform: history_stats
    name: "Vitrocrossal Allumages Derniere Heure"
    unique_id: vitrocrossal_burner_starts_last_hour
    entity_id: binary_sensor.vitrocrossal_300_cu3a_burner
    state: "on"
    type: count
    end: "{{ now() }}"
    duration: "01:00:00"

  - platform: history_stats
    name: "Vitrocrossal Allumages Jour"
    unique_id: vitrocrossal_burner_starts_daily_history
    entity_id: binary_sensor.vitrocrossal_300_cu3a_burner
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Vitrocrossal Bruleur Temps ECS Jour"
    unique_id: vitrocrossal_burner_time_dhw_daily
    entity_id: binary_sensor.vitrocrossal_300_cu3a_dhw_charging
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Vitrocrossal Bruleur Temps Total Jour"
    unique_id: vitrocrossal_burner_time_total_daily
    entity_id: binary_sensor.vitrocrossal_300_cu3a_burner
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

template:
  - sensor:
      - name: "Vitrocrossal Heures Bruleur Jour"
        unique_id: vitrocrossal_burner_hours_today_display
        unit_of_measurement: "h"
        icon: mdi:clock-outline
        state: >
          {{ states('sensor.vitrocrossal_bruleur_temps_total_jour') | float(0) | round(2) }}

      - name: "Vitrocrossal Duree Moyenne Cycle"
        unique_id: vitrocrossal_avg_cycle_duration
        unit_of_measurement: "min"
        icon: mdi:timer-outline
        state: >
          {% set s1 = states('sensor.vitrocrossal_allumages_jour') %}
          {% set s2 = states('sensor.vitrocrossal_allumages_jour_2') %}
          {% set starts = (s1 | float(0)) if s1 not in ['unknown', 'unavailable', 'none', ''] else ((s2 | float(0)) if s2 not in ['unknown', 'unavailable', 'none', ''] else 0) %}
          {% set hours = states('sensor.vitrocrossal_bruleur_temps_total_jour') %}
          {% if hours in ['unknown', 'unavailable', 'none', ''] or (s1 in ['unknown', 'unavailable'] and s2 in ['unknown', 'unavailable']) %}
            {{ this.state if this is defined and this.state not in ['unknown', 'unavailable', 'none', ''] else 'unavailable' }}
          {% elif starts > 0 and (hours | float(0)) > 0 %}
            {{ (((hours | float(0)) / starts) * 60) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Vitrocrossal Statut Cycle"
        unique_id: vitrocrossal_cycle_status
        icon: mdi:fire-circle
        state: >
          {% set raw_avg = states('sensor.vitrocrossal_duree_moyenne_cycle') %}
          {% set s1 = states('sensor.vitrocrossal_allumages_jour') %}
          {% set s2 = states('sensor.vitrocrossal_allumages_jour_2') %}
          {% set starts = (s1 | float(0)) if s1 not in ['unknown', 'unavailable', 'none', ''] else ((s2 | float(0)) if s2 not in ['unknown', 'unavailable', 'none', ''] else 0) %}
          {% set is_burner_on = is_state('binary_sensor.vitrocrossal_300_cu3a_burner', 'on') %}
          {% if raw_avg in ['unknown', 'unavailable', 'none', ''] or (s1 in ['unknown', 'unavailable'] and s2 in ['unknown', 'unavailable']) %}
            {{ this.state if this is defined and this.state not in ['unknown', 'unavailable', 'none', ''] else 'unknown' }}
          {% elif starts == 0 %}
            À l'arrêt
          {% elif starts <= 1 and is_burner_on %}
            🟢 En cours (1er cycle)
          {% else %}
            {% set avg = raw_avg | float(0) %}
            {% if avg >= 18 %}
              🟢 Optimal (Cycles longs)
            {% elif avg >= 10 %}
              🟡 Modéré
            {% else %}
              🔴 Court-cycle détecté
            {% endif %}
          {% endif %}

      - name: "Vitrocrossal Efficacite Condensation"
        unique_id: vitrocrossal_condensation_efficiency
        icon: mdi:water-percent
        state: >
          {% set supply = states('sensor.vitrocrossal_300_cu3a_supply_temperature') | float(0) %}
          {% set burner = is_state('binary_sensor.vitrocrossal_300_cu3a_burner', 'on') %}
          {% set is_dhw = is_state('binary_sensor.vitrocrossal_300_cu3a_dhw_charging', 'on') %}
          {% if not burner %}
            Repos
          {% elif is_dhw %}
            🔵 Production Eau Chaude (T° élevée normale)
          {% elif supply <= 48 %}
            🟢 Condensation Maximale (~98%)
          {% elif supply <= 55 %}
            🟡 Condensation Partielle (~92%)
          {% else %}
            🟠 Hors plage condensation (< 88%)
          {% endif %}
        attributes:
          temperature_depart: "{{ states('sensor.vitrocrossal_300_cu3a_supply_temperature') }}"
          temperature_chaudiere: "{{ states('sensor.vitrocrossal_300_cu3a_boiler_temperature') }}"
          modulation_bruleur: "{{ states('sensor.vitrocrossal_300_cu3a_burner_modulation') }}"

      - name: "Vitrocrossal Depart Recommande Loi d Eau"
        unique_id: vitrocrossal_flow_target_recommended
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:chart-bell-curve-cumulative
        state: >
          {% set ext = states('sensor.vitrocrossal_300_cu3a_outside_temperature') | float(8) %}
          {% set slope = states('number.vitrocrossal_300_cu3a_heating_curve_slope') | float(1.1) %}
          {% set shift = states('number.vitrocrossal_300_cu3a_heating_curve_shift') | float(0) %}
          {% set dt = max(0.0, 20.0 - ext) %}
          {% set target = 20.0 + slope * (0.68 * dt + 0.007 * (dt ** 2)) + shift %}
          {{ target | round(1) }}
        attributes:
          pente: "{{ states('number.vitrocrossal_300_cu3a_heating_curve_slope') }}"
          parallele: "{{ states('number.vitrocrossal_300_cu3a_heating_curve_shift') }}"
          temperature_exterieure: "{{ states('sensor.vitrocrossal_300_cu3a_outside_temperature') }}"
          temperature_depart_reelle: "{{ states('sensor.vitrocrossal_300_cu3a_supply_temperature') }}"
          reference_0_degres: "38.0"
          formule: "Viessmann Loi d'eau Vitotronic (Pente 1.1 -> 38°C à 0°C ext)"

      - name: "Vitrocrossal Conseil Loi d Eau"
        unique_id: vitrocrossal_heating_curve_advisor
        icon: mdi:head-lightbulb-outline
        state: >
          {% set ext = states('sensor.vitrocrossal_300_cu3a_outside_temperature') | float(8) %}
          {% set salon = states('sensor.thermo_2_temperature') | float(19) %}
          {% set chambre = states('sensor.thermo_1_temperature') | float(17) %}
          {% set heating_on = is_state('climate.vitrocrossal_300_cu3a_heating', 'heat') or is_state_attr('climate.vitrocrossal_300_cu3a_heating', 'active_vicare_mode', 'forcedNormal') %}
          {% if ext <= 0 and (salon < 18.2 or chambre < 16.2) and heating_on %}
            ❄️ Recommander Pente 1.2 (Grand froid)
          {% elif ext > 5 and (salon < 18.2 or chambre < 16.2) and heating_on %}
            🍂 Recommander Parallèle +1 (Demi-saison)
          {% elif ext < -3 %}
            👀 Vigilance Grand Froid (Surveiller)
          {% else %}
            🟢 Réglage optimal (Pente 1.1 / Parallèle 0)
          {% endif %}
        attributes:
          recommandation_action: >
            {% set ext = states('sensor.vitrocrossal_300_cu3a_outside_temperature') | float(8) %}
            {% set salon = states('sensor.thermo_2_temperature') | float(19) %}
            {% set chambre = states('sensor.thermo_1_temperature') | float(17) %}
            {% if ext <= 0 and (salon < 18.2 or chambre < 16.2) %}
              Passer la pente ViCare de 1.1 à 1.2 pour compenser les déperditions accrues par gel.
            {% elif ext > 5 and (salon < 18.2 or chambre < 16.2) %}
              Passer le parallèle ViCare de 0 à +1 ou +2 pour rehausser la courbe en demi-saison.
            {% elif ext < -3 %}
              Grand froid détecté. Si la maison peine à chauffer, passez la pente à 1.2. Sinon, conservez 1.1.
            {% else %}
              Aucun changement requis. La pente 1.1 est idéale et garantit plus de 95% de condensation.
            {% endif %}
          zone_climatique: >
            {% set ext = states('sensor.vitrocrossal_300_cu3a_outside_temperature') | float(8) %}
            {% if ext >= 12 %}Douceur (> 12°C)
            {% elif ext >= 5 %}Demi-saison (5°C à 12°C)
            {% elif ext >= 0 %}Frais / Proche du gel (0°C à 5°C)
            {% elif ext >= -5 %}Gel (-5°C à 0°C)
            {% else %}Grand froid (< -5°C)
            {% endif %}
          aide_memoire: "• Demi-saison (> 5°C) & froid : monter parallèle à +1\n• Grand froid (< 0°C) & froid : monter pente à 1.2\n• Trop chaud par grand froid : baisser pente à 1.0"

automation:
  - alias: "Vitrocrossal Alerte Court Cycle"
    id: vitrocrossal_alerte_court_cycle
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.vitrocrossal_allumages_derniere_heure
        above: 4
    action:
      - action: notify.mobile_app_iphone_de_loic
        data:
          title: " Chaudière : Fréquence d'allumage élevée"
          message: >-
            La Vitrocrossal 300 s'est allumée {{ states('sensor.vitrocrossal_allumages_derniere_heure') }} fois au cours de la dernière heure.
            Durée moyenne du jour : {{ states('sensor.vitrocrossal_duree_moyenne_cycle') }} min/cycle.
            Vérifiez l'ouverture des robinets de radiateur ou la consigne de température.
