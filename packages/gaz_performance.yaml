###############################################################################
# GAZ PERFORMANCE / ÉCONOMIE CHAUFFAGE
###############################################################################

input_number:
  gaz_price_kwh:
    name: "Prix gaz par kWh"
    min: 0
    max: 1
    step: 0.001
    mode: box
    unit_of_measurement: "€/kWh"
    icon: mdi:currency-eur
    initial: 0.11

  gaz_reference_daily_kwh:
    name: "Référence gaz jour avant optimisation"
    min: 0
    max: 200
    step: 0.1
    mode: box
    unit_of_measurement: "kWh/j"
    icon: mdi:fire
    initial: 55

  gaz_target_daily_kwh:
    name: "Objectif gaz jour"
    min: 0
    max: 200
    step: 0.1
    mode: box
    unit_of_measurement: "kWh/j"
    icon: mdi:target
    initial: 40

  dju_base_temperature:
    name: "Température base DJU"
    min: 10
    max: 22
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    initial: 18

###############################################################################
# COMPTEURS JOUR / MOIS / ANNÉE (RELEVÉ OFFICIEL GAZPAR GRDF)
###############################################################################

utility_meter:
  gaz_kwh_jour:
    source: sensor.gazpar_energy
    name: Gaz kWh jour
    unique_id: gaz_kwh_jour
    cycle: daily
    periodically_resetting: false

  gaz_kwh_mois:
    source: sensor.gazpar_energy
    name: Gaz kWh mois
    unique_id: gaz_kwh_mois
    cycle: monthly
    periodically_resetting: false

  gaz_kwh_annee:
    source: sensor.gazpar_energy
    name: Gaz kWh année
    unique_id: gaz_kwh_annee
    cycle: yearly
    periodically_resetting: false

  gaz_m3_jour:
    source: sensor.gazpar_volume
    name: Gaz m3 jour
    unique_id: gaz_m3_jour
    cycle: daily
    periodically_resetting: false

  gaz_m3_mois:
    source: sensor.gazpar_volume
    name: Gaz m3 mois
    unique_id: gaz_m3_mois
    cycle: monthly
    periodically_resetting: false

  gaz_m3_annee:
    source: sensor.gazpar_volume
    name: Gaz m3 année
    unique_id: gaz_m3_annee
    cycle: yearly
    periodically_resetting: false

template:
  - sensor:
      ##########################################################################
      # ESTIMATION TEMPS RÉEL HYBRIDE (BRÛLEUR LIVE + GAZPAR OFFICIEL)
      # Gazpar ne transmet qu'à J-1 (nuit). Ce capteur assure le direct.
      ##########################################################################

      - name: "Gaz kWh jour effectif"
        unique_id: gaz_kwh_today_effective
        icon: mdi:fire
        unit_of_measurement: "kWh"
        state: >
          {% set gazpar_kwh = states('sensor.gaz_kwh_jour') | float(0) %}
          {% set burner_hours = states('sensor.vitrocrossal_bruleur_temps_total_jour') | float(0) %}
          {% set kw_nominal = 15.9 %}
          {% if gazpar_kwh > 0 %}
            {{ gazpar_kwh | round(1) }}
          {% elif burner_hours > 0 %}
            {{ (burner_hours * kw_nominal) | round(1) }}
          {% else %}
            0
          {% endif %}
        attributes:
          source: >
            {% if (states('sensor.gaz_kwh_jour') | float(0)) > 0 %}
              Relevé officiel Gazpar (GRDF)
            {% else %}
              Estimation temps réel brûleur Vitrocrossal
            {% endif %}
          gazpar_brut: "{{ states('sensor.gaz_kwh_jour') }}"
          heures_bruleur: "{{ states('sensor.vitrocrossal_bruleur_temps_total_jour') }}"

      - name: "Gaz m3 jour effectif"
        unique_id: gaz_m3_today_effective
        icon: mdi:fire
        unit_of_measurement: "m³"
        state: >
          {% set gazpar_m3 = states('sensor.gaz_m3_jour') | float(0) %}
          {% set kwh = states('sensor.gaz_kwh_jour_effectif') | float(0) %}
          {% if gazpar_m3 > 0 %}
            {{ gazpar_m3 | round(1) }}
          {% elif kwh > 0 %}
            {{ (kwh / 10.55) | round(1) }}
          {% else %}
            0
          {% endif %}

      ##########################################################################
      # CAPTEURS COÛTS
      ##########################################################################

      - name: "Gaz coût jour"
        unique_id: gaz_cost_today
        icon: mdi:currency-eur
        unit_of_measurement: "€"
        state: >
          {% set kwh = states('sensor.gaz_kwh_jour_effectif') | float(0) %}
          {% set price = states('input_number.gaz_price_kwh') | float(0.11) %}
          {{ (kwh * price) | round(2) }}

      - name: "Gaz kWh hier"
        unique_id: gaz_kwh_yesterday
        icon: mdi:history
        unit_of_measurement: "kWh"
        state: >
          {{ state_attr('sensor.gaz_kwh_jour', 'last_period') | float(0) | round(1) }}

      - name: "Gaz coût hier"
        unique_id: gaz_cost_yesterday
        icon: mdi:currency-eur
        unit_of_measurement: "€"
        state: >
          {% set kwh = state_attr('sensor.gaz_kwh_jour', 'last_period') | float(0) %}
          {% set price = states('input_number.gaz_price_kwh') | float(0.11) %}
          {{ (kwh * price) | round(2) }}

      - name: "Gaz coût mois"
        unique_id: gaz_cost_month
        icon: mdi:currency-eur
        unit_of_measurement: "€"
        state: >
          {% set kwh = states('sensor.gaz_kwh_mois') | float(0) %}
          {% set price = states('input_number.gaz_price_kwh') | float(0.11) %}
          {{ (kwh * price) | round(2) }}

      - name: "Gaz coût année"
        unique_id: gaz_cost_year
        icon: mdi:currency-eur
        unit_of_measurement: "€"
        state: >
          {% set kwh = states('sensor.gaz_kwh_annee') | float(0) %}
          {% set price = states('input_number.gaz_price_kwh') | float(0.11) %}
          {{ (kwh * price) | round(2) }}

      ##########################################################################
      # PROJECTIONS
      ##########################################################################

      - name: "Gaz projection mois"
        unique_id: gaz_month_projection_kwh
        icon: mdi:chart-line
        unit_of_measurement: "kWh"
        state: >
          {% set month_kwh = states('sensor.gaz_kwh_mois') | float(0) %}
          {% set day = now().day | float(1) %}
          {% set days_in_month = 30.44 %}
          {% if day > 0 %}
            {{ ((month_kwh / day) * days_in_month) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Gaz projection coût mois"
        unique_id: gaz_month_projection_cost
        icon: mdi:currency-eur
        unit_of_measurement: "€"
        state: >
          {% set projected_kwh = states('sensor.gaz_projection_mois') | float(0) %}
          {% set price = states('input_number.gaz_price_kwh') | float(0.11) %}
          {{ (projected_kwh * price) | round(2) }}

      ##########################################################################
      # CAPTEURS CALCULÉS - Économies
      ##########################################################################

      - name: "Gaz économie jour kWh"
        unique_id: gaz_daily_saving_kwh
        icon: mdi:leaf
        unit_of_measurement: "kWh"
        state: >
          {% set ref = states('input_number.gaz_reference_daily_kwh') | float(55) %}
          {% set today = states('sensor.gaz_kwh_jour_effectif') | float(0) %}
          {{ (ref - today) | round(1) }}

      - name: "Gaz économie jour pourcentage"
        unique_id: gaz_daily_saving_percent
        icon: mdi:percent
        unit_of_measurement: "%"
        state: >
          {% set ref = states('input_number.gaz_reference_daily_kwh') | float(55) %}
          {% set today = states('sensor.gaz_kwh_jour_effectif') | float(0) %}
          {% if ref > 0 %}
            {{ (((ref - today) / ref) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Gaz écart objectif jour"
        unique_id: gaz_daily_target_delta
        icon: mdi:target
        unit_of_measurement: "kWh"
        state: >
          {% set target = states('input_number.gaz_target_daily_kwh') | float(40) %}
          {% set today = states('sensor.gaz_kwh_jour_effectif') | float(0) %}
          {{ (today - target) | round(1) }}

      - name: "Gaz économie cumulée mois kWh"
        unique_id: gaz_monthly_cumulative_saving_kwh
        icon: mdi:leaf-circle
        unit_of_measurement: "kWh"
        state: >
          {% set ref = states('input_number.gaz_reference_daily_kwh') | float(55) %}
          {% set month = states('sensor.gaz_kwh_mois') | float(0) %}
          {% set day = now().day | float(1) %}
          {% set ref_total = ref * day %}
          {{ (ref_total - month) | round(1) }}

      - name: "Gaz économie cumulée mois €"
        unique_id: gaz_monthly_cumulative_saving_eur
        icon: mdi:cash-multiple
        unit_of_measurement: "€"
        state: >
          {% set cumul_kwh = states('sensor.gaz_economie_cumulee_mois_kwh') | float(0) %}
          {% set price = states('input_number.gaz_price_kwh') | float(0.11) %}
          {{ (cumul_kwh * price) | round(2) }}

      - name: "Gaz conso moyenne journalière mois"
        unique_id: gaz_daily_avg_month
        icon: mdi:calendar-today
        unit_of_measurement: "kWh/j"
        state: >
          {% set month = states('sensor.gaz_kwh_mois') | float(0) %}
          {% set day = now().day | float(1) %}
          {% if day > 0 %}
            {{ (month / day) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Gaz référence jour kWh"
        unique_id: gaz_reference_daily_kwh_sensor
        icon: mdi:fire
        unit_of_measurement: "kWh/j"
        state: >
          {{ states('input_number.gaz_reference_daily_kwh') | float(55) }}

      ##########################################################################
      # STATUT - Indicateur texte de performance
      ##########################################################################

      - name: "Gaz statut économie"
        unique_id: gaz_saving_status
        icon: mdi:home-thermometer
        state: >
          {% set saving = states('sensor.gaz_economie_jour_pourcentage') | float(0) %}
          {% set delta = states('sensor.gaz_ecart_objectif_jour') | float(0) %}
          {% if saving >= 20 %}
            🟢 Très bon
          {% elif saving >= 10 %}
            🟢 Bon
          {% elif saving >= 0 %}
            🟡 Léger gain
          {% elif delta <= 5 %}
            🟡 Correct
          {% else %}
            🔴 Trop haut
          {% endif %}

      ##########################################################################
      # INTENSITÉ ÉNERGÉTIQUE - kWh par DJU
      ##########################################################################

      - name: "Gaz DJU jour"
        unique_id: gaz_dju_day
        icon: mdi:snowflake-thermometer
        unit_of_measurement: "DJU"
        state: >
          {% set base = states('input_number.dju_base_temperature') | float(18) %}
          {% set ext = states('sensor.vitrocrossal_300_cu3a_outside_temperature') %}
          {% if ext not in ['unknown', 'unavailable', 'None'] and ext != '' %}
            {% set out_temp = ext | float(base) %}
          {% else %}
            {% set out_temp = states('sensor.gazpar_temperature') | float(base) %}
          {% endif %}
          {{ [0, (base - out_temp)] | max | round(1) }}

      - name: "Gaz intensité énergétique"
        unique_id: gaz_energy_intensity
        icon: mdi:chart-bell-curve
        unit_of_measurement: "kWh/DJU"
        state: >
          {% set dju = states('sensor.gaz_dju_jour') | float(0) %}
          {% set kwh = states('sensor.gaz_kwh_jour_effectif') | float(0) %}
          {% if dju > 0 %}
            {{ (kwh / dju) | round(2) }}
          {% else %}
            0
          {% endif %}

      ##########################################################################
      # RÉPARTITION GAZ - Chauffage vs Eau Chaude Sanitaire (ECS)
      ##########################################################################

      - name: "Gaz part ECS pourcentage"
        unique_id: gaz_share_dhw_percent
        icon: mdi:water-boiler
        unit_of_measurement: "%"
        state: >
          {% set total_h = states('sensor.vitrocrossal_bruleur_temps_total_jour') | float(0) %}
          {% set dhw_h = states('sensor.vitrocrossal_bruleur_temps_ecs_jour') | float(0) %}
          {% if total_h > 0 %}
            {{ ([0, [(dhw_h / total_h) * 100, 100] | min] | max) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Gaz part Chauffage pourcentage"
        unique_id: gaz_share_heating_percent
        icon: mdi:radiator
        unit_of_measurement: "%"
        state: >
          {% set ecs_pct = states('sensor.gaz_part_ecs_pourcentage') | float(0) %}
          {{ (100 - ecs_pct) | round(1) }}

      - name: "Gaz kWh ECS jour"
        unique_id: gaz_kwh_dhw_today
        icon: mdi:water-boiler
        unit_of_measurement: "kWh"
        state: >
          {% set total_kwh = states('sensor.gaz_kwh_jour_effectif') | float(0) %}
          {% set ecs_pct = states('sensor.gaz_part_ecs_pourcentage') | float(0) %}
          {{ (total_kwh * (ecs_pct / 100)) | round(2) }}

      - name: "Gaz kWh Chauffage jour"
        unique_id: gaz_kwh_heating_today
        icon: mdi:radiator
        unit_of_measurement: "kWh"
        state: >
          {% set total_kwh = states('sensor.gaz_kwh_jour_effectif') | float(0) %}
          {% set heat_kwh = total_kwh - (states('sensor.gaz_kwh_ecs_jour') | float(0)) %}
          {{ [0, heat_kwh] | max | round(2) }}

      - name: "Gaz coût ECS jour"
        unique_id: gaz_cost_dhw_today
        icon: mdi:currency-eur
        unit_of_measurement: "€"
        state: >
          {% set kwh = states('sensor.gaz_kwh_ecs_jour') | float(0) %}
          {% set price = states('input_number.gaz_price_kwh') | float(0.11) %}
          {{ (kwh * price) | round(2) }}

      - name: "Gaz coût Chauffage jour"
        unique_id: gaz_cost_heating_today
        icon: mdi:currency-eur
        unit_of_measurement: "€"
        state: >
          {% set kwh = states('sensor.gaz_kwh_chauffage_jour') | float(0) %}
          {% set price = states('input_number.gaz_price_kwh') | float(0.11) %}
          {{ (kwh * price) | round(2) }}
